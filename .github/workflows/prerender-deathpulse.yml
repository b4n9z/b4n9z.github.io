name: Build & Prerender DeathPulse Docs

on:
  push:
    paths:
      - 'deathpulse-docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deathpulse-docs  # <--- fokus di folder plugin docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm i -g docsify-cli
          npm i puppeteer fs-extra

      - name: Serve Docsify
        run: |
          nohup docsify serve . --port 3000 & sleep 5

      - name: Prerender pages
        run: node tools/prerender.js

      - name: Generate sitemap
        run: node tools/generate-sitemap.js

      - name: Deploy to branch (main branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: deathpulse-docs/prerendered
          destination_dir: deathpulse-docs
          publish_branch: main