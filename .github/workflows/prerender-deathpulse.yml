name: Build & Update DeathPulse Docs (Main Branch)

on:
  push:
    paths:
      - 'deathpulse-docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deathpulse-docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm i -g docsify-cli
          npm i puppeteer@22 fs-extra

      - name: Serve Docsify locally
        run: |
          nohup docsify serve . --port 3000 & sleep 5

      - name: Prerender Docsify pages
        run: node tools/prerender.js

      - name: Generate sitemap
        run: node tools/generate-sitemap.js

      - name: Commit prerendered output back to main
        run: |
          cd ..
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          mkdir -p deathpulse-docs/prerendered
          mkdir -p deathpulse-docs/static
          cp -r deathpulse-docs/prerendered/* deathpulse-docs/static/
          rm -rf deathpulse-docs/prerendered
          git add deathpulse-docs/
          git commit -m "Update prerendered DeathPulse Docs [skip ci]" || echo "No changes to commit"
          git push origin main
