<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DeathPulse Documentation</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Description">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="shortcut icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <div id="app">Loading DeathPulse Documentation...</div>
  <script>
    window.$docsify = {
      name: 'DeathPulse',
      repo: 'https://github.com/b4n9z/DeathPulse',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 2,
      basePath: 'https://raw.githubusercontent.com/b4n9z/b4n9z.github.io/refs/heads/main/deathpulse-docs/',
      alias: {
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      themeColor: '#c0392b',
      search: {
        placeholder: 'Search',
        noData: 'No results!',
        depth: 4,
        hideOtherSidebarContent: false
      },
      darklightTheme: {
        defaultTheme: 'dark',
        siteFont: 'Inter, sans-serif',
        dark: {
          accent: '#e74c3c',
          toogleBackground : '#ffffff',
          background: '#181818',
          textColor: '#e0e0e0',
          codeTextColor: '#f1c40f',
          codeBackgroundColor : '#0e2233',
          borderColor : '#0d2538',
          blockQuoteColor : '#858585',
          highlightColor : '#d22778',
          sidebarSublink : '#b4b4b4',
          codeTypeColor : '#ffffff',
          coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)'
        },
        light: {
          accent: '#c0392b',
          toogleBackground : '#091a28',
          background: '#ffffff',
          textColor: '#333333',
          codeTextColor: '#c0392b',
          codeBackgroundColor : '#f8f8f8',
          borderColor : 'rgba(0, 0, 0, 0.07)',
          blockQuoteColor : '#858585',
          highlightColor : '#d22778',
          sidebarSublink : '#b4b4b4',
          codeTypeColor : '#091a28',
          coverBackground : 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)'
        }
      }
    };
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@latest/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
</body>
</html>
